<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Manduuhai</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cinzel:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #050814;
    min-height: 100vh;
    font-family: 'Cormorant Garamond', serif;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    color: #e8dfc8;
  }

  #sky {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 30% 20%, #0d1a3a 0%, #050814 60%);
    z-index: 0;
  }

  .star {
    position: absolute;
    border-radius: 50%;
    background: #fff;
    animation: twinkle var(--d, 3s) ease-in-out infinite var(--delay, 0s);
  }

  @keyframes twinkle {
    0%, 100% { opacity: var(--min-op, 0.2); transform: scale(1); }
    50% { opacity: 1; transform: scale(1.3); }
  }

  .moon {
    position: fixed;
    top: 60px;
    right: 120px;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fffbe8, #f0d980 40%, #c8a840 100%);
    box-shadow: 0 0 60px 20px rgba(240,210,100,0.18), 0 0 120px 60px rgba(200,168,64,0.08);
    animation: moonGlow 5s ease-in-out infinite;
    z-index: 1;
  }

  @keyframes moonGlow {
    0%, 100% { box-shadow: 0 0 60px 20px rgba(240,210,100,0.18), 0 0 120px 60px rgba(200,168,64,0.08); }
    50% { box-shadow: 0 0 80px 30px rgba(240,210,100,0.28), 0 0 160px 80px rgba(200,168,64,0.13); }
  }

  .content {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    width: 100%;
    padding: 60px 24px;
    text-align: center;
  }

  .to-line {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 18px;
    color: #b8a87a;
    letter-spacing: 0.12em;
    margin-bottom: 12px;
    opacity: 0;
    animation: fadeUp 1s ease forwards 0.3s;
  }

  .name {
    font-family: 'Cinzel', serif;
    font-size: clamp(42px, 8vw, 72px);
    font-weight: 400;
    color: #f0d980;
    letter-spacing: 0.08em;
    line-height: 1.1;
    text-shadow: 0 0 40px rgba(240,210,100,0.4);
    opacity: 0;
    animation: fadeUp 1.2s ease forwards 0.6s;
    margin-bottom: 8px;
  }

  .birthday-text {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(20px, 3.5vw, 28px);
    font-weight: 300;
    color: #c8b87a;
    letter-spacing: 0.2em;
    opacity: 0;
    animation: fadeUp 1.2s ease forwards 1s;
    margin-bottom: 48px;
  }

  .divider {
    width: 200px;
    height: 1px;
    background: linear-gradient(to right, transparent, #c8a840, transparent);
    margin: 0 auto 48px;
    opacity: 0;
    animation: fadeIn 1.5s ease forwards 1.4s;
  }

  .message-card {
    max-width: 580px;
    width: 100%;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(200,168,64,0.2);
    border-radius: 4px;
    padding: 40px 48px;
    opacity: 0;
    animation: fadeUp 1.2s ease forwards 1.7s;
    margin-bottom: 60px;
  }

  .message-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(18px, 2.5vw, 22px);
    font-weight: 300;
    font-style: italic;
    line-height: 1.9;
    color: #e0d4b0;
    letter-spacing: 0.02em;
  }

  .from-section {
    opacity: 0;
    animation: fadeUp 1.2s ease forwards 2.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .distance-text {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 15px;
    color: #7a8aaa;
    letter-spacing: 0.12em;
  }

  .from-text {
    font-family: 'Cinzel', serif;
    font-size: 14px;
    letter-spacing: 0.3em;
    color: #c8a840;
  }

  .floating-stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2;
  }

  .float-star {
    position: absolute;
    font-size: 12px;
    color: rgba(240,210,100,0.6);
    animation: floatUp var(--fd, 8s) ease-in infinite var(--fdelay, 0s);
  }

  @keyframes floatUp {
    0% { transform: translateY(0) scale(1); opacity: 0.7; }
    80% { opacity: 0.5; }
    100% { transform: translateY(-100vh) scale(0.5); opacity: 0; }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .candles {
    display: flex;
    gap: 14px;
    justify-content: center;
    margin-bottom: 48px;
    opacity: 0;
    animation: fadeIn 1s ease forwards 1.2s;
  }

  .candle-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  .flame {
    width: 8px;
    height: 14px;
    background: radial-gradient(ellipse at 50% 80%, #ffe97a 0%, #ff9a00 60%, transparent 100%);
    border-radius: 50% 50% 30% 30%;
    animation: flicker var(--fl, 1.5s) ease-in-out infinite var(--fldelay, 0s);
    box-shadow: 0 0 8px 2px rgba(255,180,0,0.5);
  }

  @keyframes flicker {
    0%, 100% { transform: scaleX(1) scaleY(1); }
    33% { transform: scaleX(0.85) scaleY(1.1); }
    66% { transform: scaleX(1.1) scaleY(0.9); }
  }

  .candle-body {
    width: 8px;
    height: 28px;
    background: linear-gradient(to bottom, #f8f0e0, #e0c890);
    border-radius: 2px;
  }

  .cake {
    font-size: 48px;
    filter: drop-shadow(0 0 12px rgba(240,210,100,0.3));
  }
</style>
</head>
<body>

<div id="sky"></div>
<div class="moon"></div>
<div class="floating-stars" id="floatingStars"></div>

<div class="content">
  <p class="to-line">for</p>
  <h1 class="name">Manduuhai</h1>
  <p class="birthday-text">Happy Birthday</p>

  <div class="candles">
    <div class="candle-wrap"><div class="flame" style="--fl:1.3s;--fldelay:0s"></div><div class="candle-body"></div></div>
    <div class="candle-wrap"><div class="flame" style="--fl:1.7s;--fldelay:0.2s"></div><div class="candle-body"></div></div>
    <span class="cake">🎂</span>
    <div class="candle-wrap"><div class="flame" style="--fl:1.4s;--fldelay:0.1s"></div><div class="candle-body"></div></div>
    <div class="candle-wrap"><div class="flame" style="--fl:1.6s;--fldelay:0.3s"></div><div class="candle-body"></div></div>
  </div>

  <div class="divider"></div>

  <div class="message-card">
    <p class="message-text">
      Happy birthday! Sending you a huge hug from Korea.<br><br>
      I hope your day is filled with all your favorite things.
    </p>
  </div>

  <div class="from-section">
    <p class="distance-text">across the miles · 한국에서 몽골까지</p>
    <p class="from-text">with love ✦</p>
  </div>
</div>

<script>
  const sky = document.getElementById('sky');
  for (let i = 0; i < 180; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2.5 + 0.5;
    s.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}%;
      top:${Math.random()*100}%;
      --d:${2+Math.random()*4}s;
      --delay:${Math.random()*5}s;
      --min-op:${0.1+Math.random()*0.4};
    `;
    sky.appendChild(s);
  }

  const floatContainer = document.getElementById('floatingStars');
  const starChars = ['✦','✧','·','⋆','∗'];
  function spawnFloatStar() {
    const el = document.createElement('div');
    el.className = 'float-star';
    el.textContent = starChars[Math.floor(Math.random()*starChars.length)];
    el.style.cssText = `
      left:${Math.random()*100}%;
      bottom:-20px;
      --fd:${7+Math.random()*8}s;
      --fdelay:0s;
      font-size:${8+Math.random()*10}px;
    `;
    floatContainer.appendChild(el);
    setTimeout(() => el.remove(), 16000);
  }
  setInterval(spawnFloatStar, 600);
</script>
</body>
</html>
